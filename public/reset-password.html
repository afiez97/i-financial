<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Kata Laluan — Kewangan Peribadi</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">💰</div>
      <h1>Kewangan Peribadi</h1>
      <p>Tetapkan kata laluan baharu</p>
    </div>

    <div id="auth-error" class="auth-error" hidden></div>

    <form id="reset-password-form">
      <div class="field">
        <label for="email">E-mel</label>
        <input type="email" id="email" required autocomplete="username">
        <span id="email-error" class="field-error"></span>
      </div>
      <div class="field">
        <label for="password">Kata Laluan Baharu</label>
        <input type="password" id="password" required autocomplete="new-password">
        <span id="password-error" class="field-error"></span>
      </div>
      <div class="field">
        <label for="password_confirmation">Sahkan Kata Laluan Baharu</label>
        <input type="password" id="password_confirmation" required autocomplete="new-password">
        <span id="password_confirmation-error" class="field-error"></span>
      </div>
      <button type="submit" id="reset-password-btn" class="btn btn-primary btn-block">Tetapkan Kata Laluan</button>
    </form>

    <p class="auth-footer"><a href="/login.html">Kembali ke Log Masuk</a></p>
  </div>
</div>

<script type="module">
import { resetPassword } from '/js/auth.js';
import { ApiError } from '/js/api.js';

const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const emailFromLink = params.get('email') || '';

const form = document.getElementById('reset-password-form');
const errorBox = document.getElementById('auth-error');
const emailInput = document.getElementById('email');

emailInput.value = emailFromLink;

if (!token) {
  errorBox.textContent = 'Pautan reset tidak sah atau telah tamat tempoh. Sila mohon pautan baharu.';
  errorBox.hidden = false;
  form.querySelector('button[type="submit"]').disabled = true;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  document.querySelectorAll('.field-error').forEach((el) => (el.textContent = ''));

  const email = emailInput.value.trim();
  const password = document.getElementById('password').value;
  const passwordConfirmation = document.getElementById('password_confirmation').value;
  const btn = document.getElementById('reset-password-btn');
  btn.disabled = true;

  try {
    await resetPassword(token, email, password, passwordConfirmation);
    window.location.href = '/login.html';
  } catch (err) {
    if (err instanceof ApiError && err.status === 422) {
      for (const [field, messages] of Object.entries(err.errors)) {
        const el = document.getElementById(`${field}-error`);
        if (el) el.textContent = messages[0];
      }
    } else {
      errorBox.textContent = (err instanceof ApiError ? err.message : null) || 'Gagal menetapkan kata laluan. Sila cuba lagi.';
      errorBox.hidden = false;
    }
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
