<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa Kata Laluan — Kewangan Peribadi</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">💰</div>
      <h1>Kewangan Peribadi</h1>
      <p>Masukkan e-mel anda untuk reset kata laluan</p>
    </div>

    <div id="auth-error" class="auth-error" hidden></div>
    <div id="auth-success" class="auth-success" hidden></div>

    <form id="forgot-password-form">
      <div class="field">
        <label for="email">E-mel</label>
        <input type="email" id="email" required autocomplete="username">
        <span id="email-error" class="field-error"></span>
      </div>
      <button type="submit" id="forgot-password-btn" class="btn btn-primary btn-block">Hantar Pautan Reset</button>
    </form>

    <p class="auth-footer"><a href="/login.html">Kembali ke Log Masuk</a></p>
  </div>
</div>

<script type="module">
import { forgotPassword, redirectIfAuthenticated } from '/js/auth.js';
import { ApiError } from '/js/api.js';

redirectIfAuthenticated();

const form = document.getElementById('forgot-password-form');
const errorBox = document.getElementById('auth-error');
const successBox = document.getElementById('auth-success');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  successBox.hidden = true;
  document.querySelectorAll('.field-error').forEach((el) => (el.textContent = ''));

  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('forgot-password-btn');
  btn.disabled = true;

  try {
    const result = await forgotPassword(email);
    successBox.textContent = result.message || 'Jika e-mel ini wujud dalam sistem, pautan reset kata laluan telah dihantar.';
    successBox.hidden = false;
    form.reset();
  } catch (err) {
    if (err instanceof ApiError && err.status === 422) {
      for (const [field, messages] of Object.entries(err.errors)) {
        const el = document.getElementById(`${field}-error`);
        if (el) el.textContent = messages[0];
      }
    } else {
      errorBox.textContent = (err instanceof ApiError ? err.message : null) || 'Gagal menghantar pautan reset. Sila cuba lagi.';
      errorBox.hidden = false;
    }
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
