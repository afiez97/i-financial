<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Masuk — Kewangan Peribadi</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">💳</div>
      <h1>Kewangan Peribadi</h1>
      <p>Log masuk untuk teruskan</p>
    </div>

    <div id="auth-error" class="auth-error" hidden></div>

    <form id="login-form">
      <div class="field">
        <label for="email">E-mel</label>
        <input type="email" id="email" required autocomplete="username">
        <span id="email-error" class="field-error"></span>
      </div>
      <div class="field">
        <label for="password">Kata Laluan</label>
        <input type="password" id="password" required autocomplete="current-password">
        <span id="password-error" class="field-error"></span>
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-block">Log Masuk</button>
    </form>

    <p class="auth-footer"><a href="/forgot-password.html">Lupa kata laluan?</a></p>
    <p class="auth-footer">Belum ada akaun? <a href="/register.html">Daftar di sini</a></p>
  </div>
</div>

<script type="module">
import { login, redirectIfAuthenticated } from '/js/auth.js';
import { ApiError } from '/js/api.js';

redirectIfAuthenticated();

const form = document.getElementById('login-form');
const errorBox = document.getElementById('auth-error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  document.querySelectorAll('.field-error').forEach((el) => (el.textContent = ''));

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;

  try {
    await login(email, password);
    window.location.href = '/index.html';
  } catch (err) {
    if (err instanceof ApiError && err.status === 422) {
      for (const [field, messages] of Object.entries(err.errors)) {
        const el = document.getElementById(`${field}-error`);
        if (el) el.textContent = messages[0];
      }
    } else {
      errorBox.textContent = (err instanceof ApiError ? err.message : null) || 'Log masuk gagal. Sila cuba lagi.';
      errorBox.hidden = false;
    }
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
